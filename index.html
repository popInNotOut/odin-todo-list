<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Todo List</title><script defer src=./main.js></script></head><body><header class=header><h1>Todo List</h1></header><div class=app><aside class=sidebar><h2>Projects</h2><nav id=project-list></nav><button id=open-project-form type=button>+ New Project</button></aside><main class=main-content><div class=project-header><h2 id=current-project-title>Inbox</h2><button id=open-todo-form type=button>+ New Todo</button></div><div id=todo-list></div></main></div><dialog id=project-dialog><form id=project-form><h2>Create Project</h2><label for=project-name>Project name</label> <input id=project-name name=projectName required><div class=form-buttons><button type=button data-close-dialog>Cancel</button> <button type=submit>Create</button></div></form></dialog><dialog id=todo-dialog><form id=todo-form><h2 id=todo-form-title>Create Todo</h2><input id=todo-id type=hidden> <label for=todo-title>Title</label> <input id=todo-title name=title required> <label for=todo-description>Description</label> <textarea id=todo-description name=description rows=4></textarea> <label for=todo-due-date>Due date</label> <input id=todo-due-date name=dueDate type=date required> <label for=todo-priority>Priority</label> <select id=todo-priority name=priority><option value=low>Low<option value=medium selected>Medium<option value=high>High</select> <label for=todo-notes>Notes</label> <textarea id=todo-notes name=notes rows=3></textarea><div class=form-buttons><button type=button data-close-dialog>Cancel</button> <button type=submit>Save Todo</button></div></form></dialog><dialog id=details-dialog><article id=todo-details></article><button type=button data-close-dialog>Close</button></dialog></body></html>
